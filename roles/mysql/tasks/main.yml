- name: Installing Mysql and dependencies
  package:
    name: "{{ item }}"
    state: present
    update_cache: yes
  loop:
    - default-mysql-server
    - default-mysql-client
    - python3-mysqldb
    - default-libmysqlclient-dev
  become: yes

- name: Copy MySQL configuration file with remote access enabled
  template:
    src: files/mysql/my.cnf.j2
    dest: /etc/mysql/my.cnf
  become: yes
  notify:
    - restart_mysql

- name: user setup in mysql
  mysql_user:
    user: "{{ default_user }}"
    password: "{{ mysql_default_pass }}"
    host: "{{ remote_host_ip }}"
    priv: '*.*:ALL,GRANT'
    login_unix_socket: /var/run/mysqld/mysqld.sock
  become: yes

- name: Creating Asterix database
  mysql_db:
    name: "{{ db_name }}"
    state: present
  become: yes

