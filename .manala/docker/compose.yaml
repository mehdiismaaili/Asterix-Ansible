name: aaterix-aasible

services:

    ##########
    # System #
    ##########

    system:
        hostname: aaterix-aasible
        build:
            context: ..
            dockerfile: docker/Dockerfile
        image: aaterix-aasible:20240511230918
        volumes:
            - ../..:${MANALA_DIR}
        environment:
            MANALA_DIR: ${MANALA_DIR}
            MANALA_CACHE_DIR: ${MANALA_CACHE_DIR}
        working_dir: ${MANALA_DIR}
        # Use default docker bridge network
        network_mode: bridge
