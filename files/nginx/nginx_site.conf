server {
    listen 80;
    server_name ince_asterix.com;  
    root /var/www/html;
    index index.html;

    location /downloads {
        alias /var/www/html/downloads;
    }

    # Handle requests for non-existent files
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }
}
